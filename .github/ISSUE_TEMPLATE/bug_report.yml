name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please remove hostnames, asset names, webhook URLs and secrets before submitting.
  - type: input
    id: version
    attributes:
      label: ppdm-alert-bot version
      placeholder: e.g. 1.3.2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Webhook / classification, SLA check, Storage check, Slack, Teams, PagerDuty, Email / digest, MCP tools, Other]
    validations:
      required: true
  - type: input
    id: source-version
    attributes:
      label: PPDM / NetWorker version
      placeholder: e.g. PPDM 19.15
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Webhook payload or log output (redacted)
      render: text
